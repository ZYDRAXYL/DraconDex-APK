name: dracondex
description: "DraconDex - Novel data management app"
publish_to: 'none'
version: 3.2.0-1+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  # SQLite-in-browser (WASM + IndexedDB) for the web/PWA build — see
  # lib/core/database/db_factory_web.dart. Requires a one-time toolchain step
  # (`dart run sqflite_common_ffi_web:setup`) to fetch sqlite3.wasm +
  # sqflite_sw.js; see docs/UPDATE.md / CI workflow for where that runs.
  sqflite_common_ffi_web: ^1.1.2

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Settings persistence
  shared_preferences: ^2.3.5

  # File import/export
  file_picker: ^9.0.1
  share_plus: ^10.1.4

  # Browser APIs (window.open, postMessage) for the web/PWA build's Google
  # login popup — lib/data/services/google_auth_platform_web.dart. Already
  # resolved transitively; declared directly because this app imports it.
  # It replaced google_sign_in, whose Android half needs an OAuth client
  # registered against this app's package name + signing SHA-1 and fails
  # with ApiException 10 until someone does that; see google_auth_service.dart.
  web: ^1.1.0

  # Color picker
  flutter_colorpicker: ^1.1.0

  # Relations force-directed graph
  graphview: ^1.2.0

  # Internationalization
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # Update-check notice (GitHub Releases) — see docs/UPDATE.md, and the
  # DDX Transfer client (data/services/ddx_transfer_service.dart).
  http: ^1.2.2

  # DDX Transfer. All three are pure Dart with no native half, which is what
  # lets the same service run on Android and in the web/PWA build:
  #   cryptography — AES-256-GCM and PBKDF2-SHA256 for the transfer wire
  #                  format. `crypto` above hashes and nothing else.
  #   archive      — gzip. dart:io's GZipCodec does not exist on web.
  #   qr_flutter   — renders the transfer link as a QR for the other device.
  cryptography: ^2.7.0
  archive: ^3.6.1
  qr_flutter: ^4.1.0
  # Verifies a downloaded release APK against the checksums-sha256.txt the
  # release workflow publishes, before it is handed to Android's package
  # installer (apk_installer_io.dart). Already resolved transitively; declared
  # directly because this app imports it.
  crypto: ^3.0.7
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  # In-app update install: hands the downloaded release APK to Android's own
  # package installer (see UpdateService.installApk in update_service.dart).
  open_filex: ^4.7.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs the real vault schema against sqlite on the test host, so
  # test/vault_snapshot_test.dart can hold the Dart port of the snapshot
  # engine to an actual round trip instead of only type-checking it. The
  # port's other half lives in electron/src/db/sync.js, and the two drifting
  # apart is the failure this guards.
  sqflite_common_ffi: ^2.3.3

# generate is off because the custom "qd" (Draconic) locale is rejected by
# newer gen-l10n validation; the generated files in lib/core/i18n are committed.
flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/
    # Vendored from DraconDex-SDB templates/ (Procress 12 part 0): the genre
    # bundles and the TH/EN guide. Read by APK V3's template picker.
    - assets/templates/
    - assets/templates/guide/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    # Thai glyphs, which NotoSans lacks — the PDF export's fallback font
    # (lib/data/services/export/pdf_export.dart). Vendored from DraconDex-SDB.
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
